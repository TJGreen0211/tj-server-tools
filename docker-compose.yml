x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${NVIDIA_DEVICE_ID:-0}"]
            capabilities: [gpu]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20m
  environment:
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

services:
  speech:
    <<: *gpu
    build: services/speech
    ports:
      - "0.0.0.0:${SPEECH_PORT:-5003}:8000"
    volumes:
      - ./models:/models
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - MEETING_WINDOW_SEC=${MEETING_WINDOW_SEC:-480}
      - SAME_SPEAKER_SIMILARITY=${SAME_SPEAKER_SIMILARITY:-0.5}
      - SILENCE_RMS=${SILENCE_RMS:-0.005}

  tts:
    <<: *gpu
    build: services/tts
    ports:
      - "0.0.0.0:${TTS_PORT:-5004}:8000"
    volumes:
      - ./models:/models
      - ./voices:/voices
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TTS_MODEL=${TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      - TTS_DTYPE=${TTS_DTYPE:-auto}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-default}
      - TTS_CLONE_MODE=${TTS_CLONE_MODE:-auto}
      - TTS_STREAM_CHUNK=${TTS_STREAM_CHUNK:-8}
